[project]
name = "mva-research"
version = "0.1.0"
description = "Provenance-first rare-disease variant prioritisation and mechanism-grounded drug-repurposing hypothesis pipeline (MVA Hackathon 2026)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "mva-research contributors" }]
keywords = ["rare-disease", "genomics", "variant-prioritisation", "drug-repurposing", "provenance"]

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "typer>=0.12,<1",
    "rich>=13.7",
    "duckdb>=1.1,<2",
    "pyarrow>=17,<22",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
# Native genomics backends. Installable on macOS/arm64 (verified), but the
# pipeline degrades to deterministic pure-Python adapters when absent.
genomics = [
    "cyvcf2>=0.31",
    "pysam>=0.22",
]
# Snakemake workflow driver. The same DAG is executable without it via
# `mva run all` (see docs/decisions/0001-workflow-engine.md).
workflow = [
    "snakemake>=8.20,<10",
]

[project.scripts]
mva = "mva.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "pyright>=1.1.384",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mva"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "workflow/containers"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "DTZ",         # naive datetimes -> determinism/provenance hazard
    "T20",         # no print() outside CLI rendering
    "SIM",         # simplify
    "PTH",         # use pathlib
    "RUF",
    "S",           # bandit-style security
    "ARG",         # unused arguments
    "PL",          # pylint subset
]
ignore = [
    "PLR0911",  # many returns: type-dispatch functions read better flat than nested
    "PLR0913",  # many arguments: domain constructors legitimately need them
    "PLR2004",  # magic values: scoring code is explicit by design
    "S101",     # assert: used in tests and internal invariants
]

[tool.ruff.lint.per-file-ignores]
# Tests defer some imports to keep collection fast and to import a module only
# inside the test that needs it.
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002", "T20", "DTZ", "PLC0415"]
# The CLI defers heavy imports (duckdb, pyarrow, jinja2) into command bodies so
# that `mva --help` and `mva info` stay fast, and so a broken optional stage
# cannot break the whole CLI. This is deliberate, not an oversight.
"src/mva/cli.py" = ["T20", "PLR0913", "B008", "PLC0415"]
"src/mva/reporting/render.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["mva"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pyright (strict)
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "workflow/containers"]
pythonVersion = "3.12"
pythonPlatform = "Darwin"
typeCheckingMode = "strict"
reportMissingTypeStubs = false          # cyvcf2 / pysam / duckdb ship no stubs
reportUnknownMemberType = false         # third-party untyped surfaces
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = "error"    # but OUR code must be fully typed
reportMissingParameterType = "error"
reportUnnecessaryIsInstance = false
reportPrivateUsage = "warning"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast isolated tests",
    "integration: multi-stage pipeline tests",
    "golden: end-to-end expectation locks",
    "privacy: privacy boundary enforcement tests",
    "slow: excluded from the default fast loop",
]
filterwarnings = ["error::DeprecationWarning:mva.*"]

[tool.coverage.run]
source = ["src/mva"]
branch = true
