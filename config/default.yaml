# Default tunables shared by all cases.
#
# EVERY weight and threshold below is a documented HEURISTIC, chosen by reasoning
# about a severe paediatric recessive disorder. None is calibrated against a
# labelled dataset and none carries a claim of clinical validity.
#
# Changing any value requires (GP-32):
#   1. a decision record in docs/decisions/
#   2. a test covering the new behaviour
#   3. an explicit before/after comparison
#   4. no silent re-baselining of golden expectations

weights:
  # Analytical validity carries the largest weight: a variant that is not
  # analytically real cannot be causal, however attractive its biology.
  analytical_validity: 0.20
  rarity: 0.18
  molecular_consequence: 0.18
  inheritance_consistency: 0.16
  phenotype_similarity: 0.14
  mechanistic_relevance: 0.08
  evidence_quality: 0.06
  # Subtracted from the weighted sum. Deliberately larger than the smallest
  # positive weights so contradicting evidence can actually move a candidate.
  contradiction_penalty_weight: 0.25

phase_weights:
  # In-cis is near-disqualifying, not disqualifying: short-read phasing can be
  # wrong, and deleting the candidate outright would violate GP-13.
  trans_confirmed: 1.00
  trans_likely: 0.85
  unknown: 0.55          # the expected state for a proband-only VCF
  cis_likely: 0.10
  cis_confirmed: 0.02

frequency:
  ultra_rare: 0.00001
  rare: 0.0001
  low_frequency: 0.001
  max_plausible_recessive: 0.01
  # A population reporting fewer than this many alleles may not set the maximum
  # AF; it is recorded as excluded instead. AC=1 in AN=40 is an AF of 0.025 and
  # would read as 'common', discarding a genuine founder allele (ADR 0010).
  min_allele_number: 2000
  # Mid-range, not 1.0: absence of frequency data is not evidence of rarity (GP-14).
  absent_frequency_score: 0.5

quality:
  min_depth: 10
  min_genotype_quality: 20
  min_allele_balance_het: 0.25
  max_allele_balance_het: 0.75
  # Below the het band but above this floor, a call is flagged 'possible_mosaic'
  # rather than 'low_allele_balance'. In a mosaic aneuploidy disorder, skewed
  # allele balance may be signal rather than artifact.
  mosaic_allele_balance_floor: 0.10

# Annotation triage (ADR 0028). The relevance bar the STAGED annotation path
# partitions on: consequence annotation runs over the whole callset, then only the
# variants that clear this bar get a gnomAD lookup, a ClinVar lookup, a full
# evidence set and a row in variants/annotated.json. Everything else gets one
# ~75-byte row in the discard ledger.
#
# Why this is not a second `selection` block: it runs EARLIER, for a different
# reason (cost, not plausibility), and it must be provably WIDER than `selection`
# or the partition would change the answer. The composition root narrows it
# automatically where it is not and reports every narrowing as a run warning.
#
# Measured: a whole-genome callset put 14,228 of 4,962,060 variants (0.284%) above
# a HIGH/MODERATE bar. `min_impact: low` is deliberately looser than that, and
# `retain_unassessed_impact` looser again, because the cost of being generous is
# throughput and the cost of being tight is the answer.
triage:
  enabled: true
  # HIGH, MODERATE and LOW all survive; only a variant that is MODIFIER on every
  # transcript, with no coding or splice term and no SpliceAI signal, is dropped.
  min_impact: low
  # ADR 0016. `impact is None` is NOT ASSESSED, not a prediction of harmlessness.
  retain_unassessed_impact: true
  # False is provable rather than heuristic: pairing is gene-scoped, so a variant
  # with no gene symbol forms no candidate pair under any configuration. ~55% of a
  # whole-genome callset by volume.
  retain_without_gene_assignment: false
  # Identical to selection.min_splice_ai_delta below, and clamped to it if raised.
  min_splice_ai_delta: 0.2
  # Ask ClinVar about the WHOLE callset, before the bar, so a curated assertion can
  # keep a variant the consequence rule would drop. Measured on the scale phantom:
  # with this false the selected set went 3,616 -> 3,600, losing exactly the 16
  # variants selection.retain_pathogenic_clinical would have rescued. ClinVar is one
  # ~100 MB tabix file; gnomAD is 22 multi-gigabyte shards, and gnomAD stays behind
  # the bar. This is the cheap half of the deferral and it is the one that was wrong.
  clinical_before_bar: true

# Candidate selection (ADR 0019). The ONE stage entitled to delete a valid
# record, so its cut-points are stated apart from the ranking cut-points above:
# `max_population_frequency` is deliberately LOOSER than
# `frequency.max_plausible_recessive`, so nothing deleted here was still rankable
# above zero on rarity (GP-13). Every `retain_*` default is True because absence
# of information is not negative information (GP-14).
selection:
  enabled: true
  max_population_frequency: 0.02
  retain_unknown_frequency: true
  retain_unassessed_impact: true
  retain_pathogenic_clinical: true
  drop_without_gene_assignment: true
  min_splice_ai_delta: 0.2
